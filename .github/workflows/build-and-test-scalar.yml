name: build and test (scalar)
on:
  push:
  pull_request:
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
jobs:
  scalar:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: SebRollen/toml-action@v1.0.2
      id: read_rust_toolchain
      with:
        file: rust-toolchain
        field: toolchain.channel
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ steps.read_rust_toolchain.outputs.value }}
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: scalar-build-cache
        cache-targets: true
        cache-all-crates: true
    - name: format check
      run: cargo fmt --all --check
    - name: scalar-only clippy check
      run: cargo clippy --all-targets --features scalar-only -- -D warnings
    - name: scalar-only library check
      run: cargo check --lib --features scalar-only
    - name: run scalar-only tests
      run: cargo test --features scalar-only
